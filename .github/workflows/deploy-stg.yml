# Deploy de homologação (stg) no GitHub Pages a cada push na main.
# Pré-requisitos (uma vez): Settings → Pages → Source = "GitHub Actions".
# A URL fica em https://<owner>.github.io/<repo>/ e aparece no environment "staging".
#
# Para outra hospedagem (S3/CloudFront, nginx em container, etc.) troque apenas o job `deploy`:
# o artefato `dist-homologacao` já sai pronto do job `build`.
name: Deploy STG

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stg
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build homologação com base-href do Pages
        run: npx ng build --configuration homologacao --base-href "/${{ github.event.repository.name }}/"
      - name: SPA fallback (rotas do Angular em deep link)
        run: cp dist/sugestao-front/browser/index.html dist/sugestao-front/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sugestao-front/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
